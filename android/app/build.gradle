// ★【0.04.03】すするanki の Android アプリ（WebView 版。前の版は Trusted Web Activity で、中で Chrome を使っていた）
// 中身はウェブ版（GitHub Pages）を Android の内蔵部品（Android System WebView）で表示する。Chrome は使わないので、Chrome の時間制限の影響を受けない。
// アプリの中身の更新はウェブ版を更新するだけで届く（APK を作り直すのは、アプリ本体（MainActivity.java など）を変えたときだけ）
plugins {
    id 'com.android.application'
}

// バージョンはウェブ版の version-info.js から取る（0.03.14 → versionCode 314）
def versionFile = rootProject.file('../version-info.js')
def appVersion = (versionFile.text =~ /APP_VERSION\s*=\s*["']([^"']+)["']/)[0][1]
def parts = appVersion.tokenize('.').collect { it as int }
def code = parts[0] * 1000000 + parts[1] * 1000 + parts[2]

android {
    namespace 'io.github.susuruchachi.susuruanki'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.susuruchachi.susuruanki'
        minSdk 24
        targetSdk 35
        versionCode Math.max(code, 1)
        versionName appVersion

        def host = 'susuruchachi.github.io'
        def path = '/-anki0.02.03.000-0-c/'
        resValue 'string', 'appName', 'すするanki'
        resValue 'string', 'launcherName', 'すするanki'
        resValue 'string', 'launchUrl', "https://${host}${path}?source=app"
        resValue 'string', 'hostName', host
        resValue 'string', 'pathPrefix', path
        // Google ログインに使う、Firebase プロジェクトの「ウェブ クライアント ID」（秘密ではない）
        resValue 'string', 'webClientId', '926791749187-pq139a7m09tnp8pupfineqp8ibruhu9v.apps.googleusercontent.com'
    }

    signingConfigs {
        release {
            // 署名鍵は環境変数で渡す（GitHub Actions では Secrets から）。無ければデバッグ用の鍵で署名する
            def ks = System.getenv('SUSURU_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SUSURU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SUSURU_KEY_ALIAS') ?: 'susuruanki'
                keyPassword System.getenv('SUSURU_KEY_PASSWORD') ?: System.getenv('SUSURU_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SUSURU_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
