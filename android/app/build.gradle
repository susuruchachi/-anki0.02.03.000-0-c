// ★【0.03.14】すするanki の Android アプリ（Trusted Web Activity）
// 中身はウェブ版（GitHub Pages）をそのまま Chrome で全画面表示する。アプリの更新はウェブ版を更新するだけで届く
plugins {
    id 'com.android.application'
}

// バージョンはウェブ版の version-info.js から取る（0.03.14 → versionCode 314）
def versionFile = rootProject.file('../version-info.js')
def appVersion = (versionFile.text =~ /APP_VERSION\s*=\s*["']([^"']+)["']/)[0][1]
def parts = appVersion.tokenize('.').collect { it as int }
def code = parts[0] * 1000000 + parts[1] * 1000 + parts[2]

android {
    namespace 'io.github.susuruchachi.susuruanki'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.susuruchachi.susuruanki'
        minSdk 21
        targetSdk 35
        versionCode Math.max(code, 1)
        versionName appVersion

        def host = 'susuruchachi.github.io'
        def path = '/-anki0.02.03.000-0-c/'
        resValue 'string', 'appName', 'すするanki'
        resValue 'string', 'launcherName', 'すするanki'
        resValue 'string', 'launchUrl', "https://${host}${path}?source=twa"
        resValue 'string', 'hostName', host
        resValue 'string', 'pathPrefix', path
        resValue 'string', 'providerAuthority', 'io.github.susuruchachi.susuruanki.fileprovider'
        resValue 'string', 'assetStatements', "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    signingConfigs {
        release {
            // 署名鍵は環境変数で渡す（GitHub Actions では Secrets から）。無ければデバッグ用の鍵で署名する
            def ks = System.getenv('SUSURU_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SUSURU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SUSURU_KEY_ALIAS') ?: 'susuruanki'
                keyPassword System.getenv('SUSURU_KEY_PASSWORD') ?: System.getenv('SUSURU_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SUSURU_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
