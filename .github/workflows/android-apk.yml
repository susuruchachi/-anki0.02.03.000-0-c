# ★【0.03.14】Android アプリ（APK）を作る（手動で実行：Actions → android-apk → Run workflow）
# 中身はウェブ版をそのまま表示するので、作り直すのはアイコンや名前を変えたいときだけで大丈夫です。
# 署名鍵：Secrets に ANDROID_KEYSTORE_BASE64（.jks を base64 にしたもの）と ANDROID_KEYSTORE_PASSWORD を入れておく
#        （無いときは使い捨ての鍵で署名するので、前のアプリを一度アンインストールしないと上書きできません）
name: android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "SUSURU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "署名鍵が無いので使い捨ての鍵で署名します"; fi
      - name: Build APK
        working-directory: android
        env:
          SUSURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: susuruanki-apk
          path: android/app/build/outputs/apk/release/app-release.apk
