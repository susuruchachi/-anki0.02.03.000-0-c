# ★【0.03.14】Android アプリ（APK）を作る（手動で実行：Actions → android-apk → Run workflow）
# 中身はウェブ版をそのまま表示するので、作り直すのはアプリ本体（android/）を変えたときだけで大丈夫です。
# 作り直した APK を apk/susuruanki.apk に置き、version-info.js の ANDROID_APK_VERSION を上げると、アプリの中で更新を知らせます。
# 署名鍵：Secrets に ANDROID_KEYSTORE_BASE64（.jks を base64 にしたもの）と ANDROID_KEYSTORE_PASSWORD を入れておく
#        （無いときは使い捨ての鍵で署名するので、前のアプリを一度アンインストールしないと上書きできません）
name: android-apk

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '作った APK を apk/susuruanki.apk に置いて、アプリの中で更新を知らせる（ANDROID_APK_VERSION を上げる）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ★【0.04.12】android-actions/setup-android は、もう無い「tools」を入れようとして失敗するようになったので使わない
      #  （GitHub の実行環境には Android SDK が入っている。足りない部品は組み立てのときに自動で入る）
      - name: Use the preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "SUSURU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "署名鍵が無いので使い捨ての鍵で署名します"; fi
      - name: Build APK
        working-directory: android
        env:
          SUSURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: susuruanki-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      # ★【0.04.12】本物の署名鍵で作れたら、APK をリポジトリに置いて、アプリの中の更新のお知らせ（ANDROID_APK_VERSION）を上げる
      - name: Publish APK to the branch
        if: ${{ inputs.publish && env.SUSURU_KEYSTORE != '' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk apk/susuruanki.apk
          V=$(sed -n 's/^const APP_VERSION = "\([^"]*\)".*/\1/p' version-info.js)
          sed -i "s/^const ANDROID_APK_VERSION = \"[^\"]*\"/const ANDROID_APK_VERSION = \"$V\"/" version-info.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/susuruanki.apk version-info.js
          git commit -m "APK $V を公開（アプリの中で更新を知らせる）" || echo "変更なし"
          git push
